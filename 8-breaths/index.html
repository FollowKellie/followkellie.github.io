<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>8 Breaths</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* layout: one screen. the tent map on the left, the station you stand at on the right; stacked on a phone. single dark look on purpose: a tent at night. */
  :root{
    color-scheme:dark;
    --bg:#0e0c0a; --ink:#f3ead9; --dim:#a79c88; --line:#3a332a;
    --in:#d9a45b; --out:#7fb7c9; --centre:#f6d58a; --panel:#17130f; --accent:#f6d58a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font:17px/1.55 Georgia,"Iowan Old Style","Times New Roman",serif}
  button{font:inherit;color:var(--ink);background:#241d16;border:1px solid var(--line);
    border-radius:999px;padding:.55em 1.1em;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button[aria-pressed="true"]{background:var(--accent);color:#1a1408;border-color:var(--accent)}
  .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);height:100%}
  .stage{position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .controls{position:absolute;left:0;right:0;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;
    align-items:center;flex-wrap:wrap;background:linear-gradient(transparent,rgba(14,12,10,.92) 40%)}
  .controls input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
  .panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding-block:26px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .digit{font-size:64px;line-height:1;color:var(--accent);margin:0}
  h1{font-size:26px;margin:.1em 0 .1em;font-weight:normal}
  .q{color:var(--dim);font-style:italic;margin:0 0 18px}
  blockquote{margin:0 0 16px;padding:0 0 0 14px;border-left:2px solid var(--accent);font-size:19px}
  cite{display:block;font-size:13px;color:var(--dim);font-style:normal;margin-top:4px}
  .song{margin:18px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  .song b{color:var(--accent);font-weight:normal}
  .wall{position:relative;margin:18px 0 8px;padding:18px 14px 12px;border-radius:6px;background:radial-gradient(120% 90% at 50% 0%, #3a3128 0%, #1d1813 55%, #120f0c 100%)}
  .hang{display:flex;gap:14px;align-items:center;justify-content:center;min-height:200px}
  .frame{position:relative;flex:1 1 0;min-width:0;height:min(46vh,340px)}
  .frame img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;opacity:0;transition:opacity 1.8s ease;box-shadow:0 10px 28px rgba(0,0,0,.6), 0 0 44px rgba(246,213,138,.12)}
  .frame img.on{opacity:1}
  .frame.canvas{background:#efe9dc;box-shadow:0 10px 28px rgba(0,0,0,.6)}
  .frame.canvas img{box-shadow:none}
  .wallcap{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px;font-size:12px;color:var(--dim)}
  .wallcap button{font-size:13px;padding:.3em .8em}
  #gallery{position:fixed;inset:0;z-index:9;background:#120f0c;overflow:auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #gallery header{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:#120f0c;padding:8px 0 12px;z-index:2}
  #gallery h2{font-weight:normal;font-size:22px;margin:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
  .grid button{all:unset;cursor:pointer;display:block;aspect-ratio:1;background:radial-gradient(120% 90% at 50% 0%, #3a3128 0%, #1d1813 60%, #120f0c 100%);border-radius:6px;position:relative}
  .grid button:focus-visible{outline:2px solid var(--accent)}
  .grid img{position:absolute;inset:10px;margin:auto;max-width:calc(100% - 20px);max-height:calc(100% - 20px);box-shadow:0 6px 16px rgba(0,0,0,.6)}
  .one{display:grid;gap:14px;justify-items:center}
  .one img.big{max-width:100%;max-height:70vh;box-shadow:0 14px 36px rgba(0,0,0,.7)}
  .strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .strip img{height:110px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.6)}
  /* a door, not a station: an office plate screwed to the canvas (patch from sister session local_63a93fe1, 2026-11-22) */
  .door{display:block;margin:22px 0 4px;padding:14px 16px;border:1px solid var(--line);
    background:#1b1712;text-decoration:none;color:var(--ink);border-radius:2px;
    transition:border-color .25s ease,background .25s ease}
  .door:hover,.door:focus-visible{border-color:var(--dim);background:#201b15}
  .door:focus-visible{outline:2px solid var(--dim);outline-offset:2px}
  .door .plate{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .door .sub{display:block;font-size:15px;margin-top:3px;color:var(--ink)}
  .door .hint{display:block;font-size:13px;line-height:1.5;color:var(--dim);margin-top:9px}
  .door .addr{display:block;font-size:11px;color:var(--dim);margin-top:9px;opacity:.8;word-break:break-all}
  @media(max-width:720px){ .door .plate{font-size:11px} .door .sub{font-size:14px} }
  .breath{margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:12px;text-align:center}
  .breath .count{font-size:40px;color:var(--accent)}
  .breath .phase{color:var(--dim);min-height:1.6em}
  .mantra{font-size:20px;margin:.4em 0}
  .passing{color:var(--out);font-style:italic;min-height:3.2em;margin:18px 0 0}
  .foot{margin-top:28px;font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px}
  #gate{position:fixed;inset:0;background:rgba(14,12,10,.96);display:grid;place-items:center;z-index:10;text-align:center;padding-block:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  #gate h2{font-weight:normal;font-size:34px;margin:0 0 .3em}
  #gate p{max-width:34em;margin:.4em auto;color:var(--dim)}
  #gate button{font-size:20px;margin-top:18px;padding:.7em 1.6em}
  @media (max-width:820px){
    .wrap{grid-template-columns:1fr;grid-template-rows:50% 50%;height:100%}
    .stage{display:grid;grid-template-rows:minmax(0,1fr) auto}
    .controls{position:static;background:none;gap:8px;padding-block:6px 8px}
    .controls button{font-size:14px;padding:.4em .9em}
    .controls input[type=range]{order:-1;flex-basis:100%}
    .digit{font-size:40px}
    .frame{height:min(30vh,240px)}
    .wall{padding:14px 10px 10px}
    blockquote{font-size:17px}
    .panel{border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div id="gate">
  <div>
    <h2>8 Breaths</h2>
    <p>A spiral walk through the Grateful Protocol. In by one path, out by another.</p>
    <p>Headphones are best. One tap, and it walks and plays for you.</p>
    <button id="enter">Walk me through it</button>
    <p><button id="enterSelf" style="font-size:15px;margin-top:10px">I will walk it myself</button></p>
    
  </div>
</div>

<div class="wrap">
  <div class="stage">
    <canvas id="c" aria-label="Map of the tent with a spiral path in and a spiral path out"></canvas>
    <div class="controls">
      <div id="now" aria-live="polite" style="flex-basis:100%;order:-2;font-size:14px;color:var(--accent);min-height:1.5em;text-align:center"></div>
      <button id="walk" aria-pressed="false">Walk for me</button>
      <input id="pos" type="range" min="0" max="1000" value="0" aria-label="Where you are on the path">
      <button id="read" aria-pressed="false" title="Read the words aloud">Read aloud</button>
      <button id="mute" aria-pressed="false">Sound off</button>
      <button id="all">Paintings</button>
    </div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script>
(async function(){
  const J = async (u, fallback) => { try{ const r = await fetch(u,{cache:'no-store'}); if(!r.ok) throw 0; return await r.json(); }catch(e){ return fallback; } };
  const data  = await J('stations.json', {stations:[],passing:[]});
  const audioM = await J('assets/audio/audio-manifest.json', {});
  const artM   = await J('assets/art/art-manifest.json', []);
  const sound  = await J('sound.json', null);        // optional: one ambient bed and many small spoken pieces
  const S = data.stations;

  /* ---------- geometry: two spiral arms that meet at the centre ---------- */
  const TURNS = 1.6, TH0 = Math.PI*0.5;           // door at the bottom
  function pt(t){                                   // t in 0..1 along the whole walk, unit circle coords
    const inward = t <= .5;
    const u = inward ? t*2 : (1-t)*2;               // 0 at the tent wall, 1 at the centre
    const r = 0.94*(1-u);
    const th = TH0 + TURNS*2*Math.PI*u + (inward?0:Math.PI);
    return {x:r*Math.cos(th), y:r*Math.sin(th), inward};
  }
  S.forEach(s=>{ s.p = pt(s.t); });

  /* ---------- art: group files by station ---------- */
  const groups = {};
  artM.forEach(a=>{ const g = (groups[a.group] = groups[a.group] || {name:a.group, views:[], treatments:[]}); (a.role==='root' ? g.views : g.treatments).push(a); });
  const worksOf = s => [].concat(s.art||[]).map(n=>groups[n]).filter(g=>g && (g.views.length||g.treatments.length));

  /* ---------- sound ---------- */
  let ctx=null, started=false, muted=false, speakingNow=false, guided=false, holdUntil=0, holdMax=0;
  const RADIUS = 0.42;                              // how far a station's sound reaches (tent radius = 1)
  S.forEach(s=>{
    const m = audioM[s.id] && audioM[s.id].main;
    s.song = m || null;
    if(!m) return;
    const el = new Audio('assets/audio/'+m.file); el.loop = true; el.preload = 'none';
    s.el = el; s.gainValue = 0;
  });
  const bedMode = !!(sound && sound.use_bed && sound.bed && sound.bed.file);   // her ruling 2026-11-21: songs stay; the bed is only an option
  let bed=null, voiceNow=null, songNow=null, prevT=0;
  const V = ((sound && sound.voices) || []).filter(v=>v.file && !v.skip).map(v=>Object.assign({}, v, {file:String(v.file).split('/').pop(), p:pt(v.t)}));
  if(bedMode){ bed={el:new Audio('assets/audio/'+String(sound.bed.file).split('/').pop())}; bed.el.loop=true; bed.el.preload='none'; }
  V.forEach(v=>{ v.el=new Audio('assets/audio/'+v.file); v.el.preload='none'; v.el.onended=()=>{ v.playing=false; if(voiceNow===v) voiceNow=V.find(o=>o.playing)||null; update(true); showVoice(); }; });
  S.forEach(s=>{ const a=s.alt_song; if(!a) return; const src=audioM[a.station_file] && audioM[a.station_file].main; if(!src) return;
    const el=new Audio('assets/audio/'+src.file); el.preload='none'; const o={el, start:a.start||0, title:a.title||src.title};
    el.addEventListener('ended',()=>{ try{ el.currentTime=o.start; }catch(e){} if(o.target) el.play().catch(()=>{}); });
    s.altObj=o; });
  const everySound = ()=>S.filter(s=>s.el).concat(S.filter(s=>s.altObj).map(s=>s.altObj), bed?[bed]:[], V);
  // Plain audio elements only. No Web Audio: on a hosted page it can go silent, and silence is the one failure that matters.
  const canVol = (()=>{ try{ const a=new Audio(); a.volume=0.5; return a.volume===0.5; }catch(e){ return false; } })();   // iPhones ignore volume
  function startAudio(){
    if(started) return; started = true;
    everySound().forEach(s=>{            // phones only let a sound start from a tap, so each one is woken silently on this first tap
      if(s.target>0) return;             // the one that should be heard starts normally
      s.waking=true; s.el.muted=true; try{ s.el.volume=0; }catch(e){}
      const done=()=>{ if(!s.target) s.el.pause(); setTimeout(()=>{ s.waking=false; if(s.target>0 || s.el.paused) s.el.muted=false; }, 80); };
      const pr=s.el.play(); if(pr&&pr.then) pr.then(done).catch(done); else done();
    });
    // watchdog: twice a second, anything that should be silent is stopped
    setInterval(()=>{ everySound().forEach(s=>{ if(!s.target && !s.waking && !s.el.paused && !s.ramp) s.el.pause(); }); }, 500);
  }
  const stopAll = ()=>{ try{ everySound().forEach(s=>{ clearInterval(s.ramp); s.ramp=0; s.target=0; s.el.pause(); }); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} };
  if(window.__ebStop){ try{ window.__ebStop(); }catch(e){} }      // if the page was updated in place, silence the copy that was here before
  window.__ebStop = stopAll;
  window.addEventListener('pagehide', stopAll);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ walking(false); stopAll(); } else { update(true); kick(); } });
  function kick(){ if(!started || muted) return; everySound().forEach(s=>{ if(s.target>0){ s.el.muted=false; if(s.el.paused) s.el.play().catch(()=>{}); } }); }
  document.addEventListener('pointerdown', ()=>setTimeout(kick,0));
  const FADE = 2.5;                                 // seconds to pass from one song to the next
  function owner(){ let best=null, bd=9; S.forEach(s=>{ if(!s.el) return; const d=Math.abs(s.t-t); if(d<bd){ bd=d; best=s; } }); return best; }
  function setG(s,g){
    if(s.target===g) return; s.target=g; s.gainValue = g ? 1 : 0;
    clearInterval(s.ramp); s.ramp=0;
    if(g>0){ s.el.muted=false; if(s.el.paused){ if(canVol){ try{ s.el.volume=0; }catch(e){} } s.el.play().catch(()=>{}); } }
    if(!canVol){ if(g===0) s.el.pause(); return; }
    const from=s.el.volume, t0=performance.now(), dur=FADE*1000;
    s.ramp=setInterval(()=>{ const k=Math.min(1,(performance.now()-t0)/dur); try{ s.el.volume=Math.max(0,Math.min(1,from+(g-from)*k)); }catch(e){}
      if(k>=1){ clearInterval(s.ramp); s.ramp=0; if(g===0 && !s.target) s.el.pause(); } }, 60);
  }
  function mix(){
    const on = started && !muted;
    V.forEach(v=>{ if(v.playing && Math.abs(t-v.t) > (v.reach||0.07)){ v.playing=false; if(voiceNow===v) voiceNow=V.find(o=>o.playing)||null; } });   // a voice belongs to its place
    if(bedMode){                                    // one bed for the whole tent; voices and whole songs come forward over it
      setG(bed, !on ? 0 : songNow ? 0 : (voiceNow || speakingNow) ? 0.45 : 0.8);
      S.forEach(s=>{ if(s.el) setG(s, on && songNow===s ? 1 : 0); });
    } else {                                        // no bed: each station's song owns its stretch of the path
      const o = on ? owner() : null;
      const nowEl=document.getElementById('now'); if(nowEl){ const tt = !started ? '' : muted ? 'Sound is off' : o ? ('Now playing: '+((o.useAlt&&o.altObj)?o.altObj.title:o.song.title)) : ''; if(nowEl.textContent!==tt) nowEl.textContent=tt; }
      S.forEach(s=>{ const lvl = s===o ? (speakingNow ? 0.35 : voiceNow ? 0.6 : 1) : 0, alt = s.useAlt && s.altObj;
        if(s.altObj){ if(alt && lvl && !s.altObj.target){ try{ s.altObj.el.currentTime=s.altObj.start; }catch(e){} } setG(s.altObj, alt ? lvl : 0); }
        if(s.el) setG(s, alt ? 0 : lvl); });   // songs never stop; they only lean back under a voice
    }
    V.forEach(v=>setG(v, on && v.playing ? 1 : 0));   // a voice belongs to its place; it fades when you walk on                                                  // voices may overlap and echo
  }
  function playVoice(v){ v.heard=true; v.playing=true; voiceNow=v; v.target=undefined;
    try{ v.el.currentTime=0; }catch(e){} mix(); showVoice(); }
  function showVoice(){ const el=document.getElementById('voice'); if(el) el.textContent = voiceNow ? ('Speaking now: '+voiceNow.title+'. ') : ''; const sb=document.getElementById('songBtn'); if(sb && current) sb.textContent = (songNow===current?'Stop the song':'Hear the whole song'); }

  /* ---------- drawing ---------- */
  const cv = document.getElementById('c'), g2 = cv.getContext('2d');
  let W=0,H=0,R=0,cx=0,cy=0, t=0;
  function size(){ const r = cv.getBoundingClientRect(), d = window.devicePixelRatio||1;
    cv.width = r.width*d; cv.height = r.height*d; g2.setTransform(d,0,0,d,0,0);
    const over = getComputedStyle(document.querySelector('.controls')).position==='absolute';
    W=r.width; H=r.height; R = Math.min(W, H-(over?70:0))/2 - (over?18:26); cx=W/2; cy=over?(H-60)/2+6:H/2; draw(); }
  const X = p=>cx+p.x*R, Y = p=>cy+p.y*R;
  const css = n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function arm(a,b,col,width,alpha){ g2.beginPath(); for(let i=0;i<=220;i++){ const p=pt(a+(b-a)*i/220); i?g2.lineTo(X(p),Y(p)):g2.moveTo(X(p),Y(p)); }
    g2.strokeStyle=col; g2.globalAlpha=alpha; g2.lineWidth=width; g2.lineCap='round'; g2.stroke(); g2.globalAlpha=1; }
  let breathing=false, breathScale=0;
  function draw(){
    g2.clearRect(0,0,W,H);
    g2.beginPath(); g2.arc(cx,cy,R+10,0,7); g2.strokeStyle=css('--line'); g2.lineWidth=2; g2.stroke();   // the tent wall
    arm(0,.5,css('--in'),10,.22); arm(.5,1,css('--out'),10,.22);                                           // the two paths
    if(t<=.5) arm(0,t,css('--in'),3,.95); else { arm(0,.5,css('--in'),3,.95); arm(.5,t,css('--out'),3,.95); }
    S.forEach(s=>{ const x=X(s.p), y=Y(s.p), gv = s.gainValue||0;
      if(gv>0.01){ const rg=g2.createRadialGradient(x,y,2,x,y,RADIUS*R*0.6); rg.addColorStop(0,'rgba(246,213,138,'+(0.28*gv)+')'); rg.addColorStop(1,'rgba(246,213,138,0)');
        g2.fillStyle=rg; g2.beginPath(); g2.arc(x,y,RADIUS*R*0.6,0,7); g2.fill(); }
      const rad = s.centre ? 22 + breathScale*26 : 15;
      g2.beginPath(); g2.arc(x,y,rad,0,7); g2.fillStyle = s.centre? 'rgba(246,213,138,.18)':'#17130f'; g2.fill();
      g2.strokeStyle = s.centre?css('--centre'):(s.p.inward?css('--in'):css('--out')); g2.lineWidth=2; g2.stroke();
      g2.fillStyle=css('--ink'); g2.font=(s.centre?'22px':'16px')+' Georgia,serif'; g2.textAlign='center'; g2.textBaseline='middle'; g2.fillText(s.digit,x,y+1);
    });
    V.forEach(v=>{ g2.beginPath(); g2.arc(X(v.p),Y(v.p),4,0,7); g2.fillStyle = v.playing ? css('--accent') : (v.heard ? 'rgba(246,213,138,.35)' : css('--dim')); g2.fill(); });
    const p=pt(t), x=X(p), y=Y(p);
    const vg=g2.createRadialGradient(x,y,1,x,y,20); vg.addColorStop(0,'rgba(255,255,255,.95)'); vg.addColorStop(.3,'rgba(255,240,200,.6)'); vg.addColorStop(1,'rgba(255,240,200,0)');
    g2.fillStyle=vg; g2.beginPath(); g2.arc(x,y,20,0,7); g2.fill();
    g2.fillStyle=css('--dim'); g2.font='13px Georgia,serif'; g2.textAlign='center';
    const a=pt(0), b=pt(1); g2.fillText('way in', X(a), Y(a)+ (a.y>0?26:-22)); g2.fillText('way out', X(b), Y(b)+(b.y>0?26:-22));
  }

  /* ---------- the panel ---------- */
  const panel = document.getElementById('panel');
  let current=null, slideTimer=null, reading=false;
  const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function nearest(){ let best=S[0], bd=9; S.forEach(s=>{ const d=Math.abs(s.t-t); if(d<bd){bd=d;best=s;} }); return best; }
  function show(s){
    current=s; clearInterval(slideTimer);
    const works = worksOf(s);
    let h = '<p class="digit">'+esc(s.digit)+'</p><h1>'+esc(s.label)+'</h1><p class="q">'+esc(s.question)+'</p>';
    if(works.length) h += '<div class="wall"><div class="hang"><div class="frame" id="fr"></div><div class="frame canvas" id="fc" hidden></div></div><div class="wallcap"><span id="wcap"></span><button id="wnext">Next painting</button></div></div>';
    s.words.forEach(w=>{ h += '<blockquote>'+esc(w.text)+'<cite>'+esc(w.source)+'</cite></blockquote>'; });
    if(s.door){ h += '<a class="door" href="'+esc(s.door.href)+'" target="_blank" rel="noopener noreferrer">'
      + '<span class="plate">'+esc(s.door.plate)+'</span>'
      + '<span class="sub">'+esc(s.door.sub)+'</span>'
      + '<span class="hint">'+esc(s.door.hint)+'</span>'
      + '<span class="addr">'+esc(String(s.door.href).replace(/^https?:\/\//,'').replace(/\/$/,''))+'</span></a>'; }
    if(s.centre){ h += '<div class="breath"><div class="count" id="bc">8</div><div class="phase" id="bp">eight breaths, shared</div><p class="mantra" id="bm">&nbsp;</p><button id="bb">Begin the eight breaths</button><p style="font-size:13px;color:var(--dim);margin:.8em 0 0">On a screen you can only keep the time. The hug itself needs someone safe, and their yes.</p></div>'; }
    if(bedMode) h += '<div class="song"><span id="voice"></span>'+(s.song?('<div>The song of this place: <b>'+esc(s.song.title)+'</b></div><button id="songBtn" style="margin-top:8px">Hear the whole song</button>'):'')+'</div>';
    else h += '<div class="song"><span id="voice"></span>'+(s.altObj?'<div style="margin-bottom:8px"><button id="altBtn"></button></div>':'')+(s.song?('Playing here: <b>'+esc(s.song.title)+'</b>'+(s.song.date?' · '+esc(s.song.date):'')):'Song for this place: not on this computer yet.')+'</div>';
    h += '<p class="passing" id="pass"></p>';
    h += '<p class="foot">'+esc(data.status||'')+'</p>';
    if(songNow && songNow!==s) songNow=null;
    panel.innerHTML = h; panel.scrollTop = 0;
    const sb=document.getElementById('songBtn'); if(sb) sb.onclick=()=>{ if(songNow===s){ songNow=null; } else { songNow=s; walking(false); } update(true); showVoice(); };
    const ab=document.getElementById('altBtn'); if(ab){ const lab=()=>{ ab.textContent = s.useAlt ? ('Now: '+s.altObj.title+'. Tap for '+s.song.title) : ('Tap to hear instead: '+s.altObj.title); }; lab(); ab.onclick=()=>{ s.useAlt=!s.useAlt; lab(); update(true); }; }
    showVoice();
    if(works.length){ const fr=document.getElementById('fr'), fc=document.getElementById('fc'), cap=document.getElementById('wcap'); let wi=-1, ti=0, tick=0;
      const fade=(box,a)=>{ const im=new Image(); im.alt=a.description||''; im.onload=()=>{ box.appendChild(im); requestAnimationFrame(()=>requestAnimationFrame(()=>im.classList.add('on'))); [...box.querySelectorAll('img')].slice(0,-1).forEach(o=>{ o.classList.remove('on'); setTimeout(()=>o.remove(),1900); }); }; im.src='assets/art/'+a.file; };
      const nextWork=()=>{ wi=(wi+1)%works.length; ti=0; tick=0; const w=works[wi]; fade(fr, w.views[0]||w.treatments[0]); const hasT = w.views.length && w.treatments.length; fc.hidden=!hasT; fc.innerHTML=''; if(hasT) fade(fc, w.treatments[0]);
        cap.textContent = 'Painting '+(wi+1)+' of '+works.length+(hasT?' · beside it, its digital lives':''); document.getElementById('wnext').hidden = works.length<2; };
      const beat=()=>{ tick++; const w=works[wi]; const hasT = w.views.length && w.treatments.length; if(hasT && w.treatments.length>1){ ti=(ti+1)%w.treatments.length; fade(fc, w.treatments[ti]); }
        const stay = hasT ? Math.max(2, w.treatments.length) : 2; if(tick>=stay && works.length>1) nextWork(); };
      nextWork(); slideTimer=setInterval(beat,5500); document.getElementById('wnext').onclick=()=>{ clearInterval(slideTimer); nextWork(); slideTimer=setInterval(beat,5500); }; }
    if(s.centre) document.getElementById('bb').onclick = eightBreaths;
    if(reading) speak(s.words.map(w=>w.text).join(' '));
  }
  function speak(txt){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); u.rate=.9; speakingNow=true; u.onend=u.onerror=()=>{ speakingNow=false; update(true); }; speechSynthesis.speak(u); update(true); }catch(e){ speakingNow=false; } }
  function passing(){ const el=document.getElementById('pass'); if(!el) return; const hit=(data.passing||[]).find(p=>Math.abs(p.t-t)<.035); el.textContent = hit? hit.text : ''; }

  /* ---------- eight breaths at the centre ---------- */
  let breathRAF=null;
  function eightBreaths(){
    if(breathing) return; breathing=true; walking(false);
    const IN=5000, OUT=6000, start=performance.now(), bc=document.getElementById('bc'), bp=document.getElementById('bp'), bm=document.getElementById('bm'), bb=document.getElementById('bb');
    if(bb) bb.style.display='none';
    (function tick(now){
      const e=now-start, n=Math.floor(e/(IN+OUT)), r=e-n*(IN+OUT);
      if(n>=9){ breathing=false; breathScale=0; if(bp)bp.textContent='Silent. Step apart.'; if(bm)bm.innerHTML='&nbsp;'; if(bc)bc.textContent='∞'; update(); walkBtn.textContent='Walk on'; if(guided) setTimeout(()=>walking(true), 4000); return; }
      const inh = r<IN; breathScale = inh ? r/IN : 1-(r-IN)/OUT;
      if(n<8){ if(bc)bc.textContent=String(n+1); if(bp)bp.textContent = inh?'breathe in':'breathe out, and soften'; if(bm)bm.textContent = inh?' ':'I love you and I am proud of you.'; }
      else { if(bc)bc.textContent='·'; if(bp)bp.textContent='one silent breath apart'; if(bm)bm.innerHTML='&nbsp;'; }
      update(true); breathRAF=requestAnimationFrame(tick);
    })(start);
  }

  /* ---------- moving ---------- */
  const slider=document.getElementById('pos');
  function update(light){
    if(V.length && started){ if(t<0.01) V.forEach(v=>v.heard=false);
      const step=t-prevT; V.forEach(v=>{ if(v.playing) return; const crossed = step>0 && step<0.05 && prevT<v.t && t>=v.t, landed = Math.abs(step)>=0.05 && Math.abs(t-v.t)<0.012; if((crossed && !v.heard) || landed) playVoice(v); }); }
    prevT=t; mix(); draw(); if(light) return;
    const n=nearest(); if(n!==current) show(n); passing(); slider.value=Math.round(t*1000); }
  function setT(v){ t=Math.min(1,Math.max(0,v)); update(); }
  slider.addEventListener('input',()=>{ walking(false); setT(slider.value/1000); });
  window.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='ArrowUp'){ walking(false); setT(t+.006);} if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ walking(false); setT(t-.006);} if(e.key===' '){ e.preventDefault(); walking(!walk);} });
  let dragging=false;
  function toPath(ev){ const r=cv.getBoundingClientRect(), mx=(ev.clientX-r.left-cx)/R, my=(ev.clientY-r.top-cy)/R; let bt=t,bd=9;
    for(let i=0;i<=600;i++){ const tt=i/600; if(Math.abs(tt-t)>.14) continue; const p=pt(tt), d=Math.hypot(p.x-mx,p.y-my); if(d<bd){bd=d;bt=tt;} } return bt; }
  cv.addEventListener('pointerdown',e=>{ dragging=true; walking(false); cv.setPointerCapture(e.pointerId); setT(toPath(e)); });
  cv.addEventListener('pointermove',e=>{ if(dragging) setT(toPath(e)); });
  cv.addEventListener('pointerup',()=>dragging=false);

  let walk=false, last=0; const LAP=240000;                 // four minutes for the whole walk
  const walkBtn=document.getElementById('walk');
  function walking(on){ walk=on; walkBtn.setAttribute('aria-pressed',on); walkBtn.textContent = on?'Pause':'Walk for me'; if(on){ last=performance.now(); requestAnimationFrame(step); } }
  function step(now){ if(!walk) return; const dt=now-last; last=now;
    if(!breathing && !(now<holdUntil || (speakingNow && now<holdMax))){ let nt=t+dt/LAP;
      if(t<.5 && nt>=.5){ setT(.5); walking(false); walkBtn.textContent='Walk on'; const bb=document.getElementById('bb'); if(bb) bb.scrollIntoView({block:'center'}); return; }
      if(nt>=1){ setT(1); walking(false); walkBtn.textContent='Walk again'; return; }
      const st=S.find(s=>!s.centre && t<s.t && nt>=s.t);
      if(st){ nt=st.t; holdUntil=now+(guided?7000:0); holdMax=Math.max(holdMax, now+45000); }
      setT(nt); }
    requestAnimationFrame(step); }
  walkBtn.onclick=()=>{ if(t>=1) setT(0); walking(!walk); };
  document.getElementById('mute').onclick=function(){ muted=!muted; this.setAttribute('aria-pressed',muted); this.textContent=muted?'Sound on':'Sound off'; update(true); };
  document.getElementById('read').onclick=function(){ reading=!reading; this.setAttribute('aria-pressed',reading); if(reading && current) speak(current.words.map(w=>w.text).join(' ')); else { try{speechSynthesis.cancel();}catch(e){} speakingNow=false; update(true); } };
  const readBtn=document.getElementById('read');
  function enter(g){ document.getElementById('gate').remove(); started=true; mix(); started=false; startAudio();
    try{ speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); }catch(e){}
    guided=g;
    update(); if(g) walking(true); }
  document.getElementById('enter').onclick=()=>enter(true);
  document.getElementById('enterSelf').onclick=()=>enter(false);

  function gallery(focus){ let g=document.getElementById('gallery'); if(!g){ g=document.createElement('div'); g.id='gallery'; document.body.appendChild(g); }
    const names=Object.keys(groups).filter(n=>groups[n].views.length||groups[n].treatments.length);
    if(!focus){ g.innerHTML='<header><h2>All the paintings</h2><button id="gclose">Back to the walk</button></header><div class="grid">'+names.map(n=>{ const w=groups[n], a=w.views[0]||w.treatments[0]; return '<button data-n="'+esc(n)+'" aria-label="'+esc(a.description||'painting')+'"><img loading="lazy" src="assets/art/'+esc(a.file)+'" alt=""></button>'; }).join('')+'</div>';
      g.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>gallery(b.dataset.n)); document.getElementById('gclose').onclick=()=>g.remove(); }
    else { const w=groups[focus], all=w.views.concat(w.treatments);
      g.innerHTML='<header><h2>'+(w.treatments.length?'The painting and its digital lives':'The painting')+'</h2><button id="gback">All the paintings</button></header><div class="one"><img class="big" id="gbig" src="assets/art/'+esc(all[0].file)+'" alt="'+esc(all[0].description||'')+'"><div class="strip">'+(all.length>1?all.map((a,i)=>'<img data-i="'+i+'" src="assets/art/'+esc(a.file)+'" alt="'+esc(a.description||'')+'">').join(''):'')+'</div></div>';
      g.querySelectorAll('.strip img').forEach(im=>im.onclick=()=>{ document.getElementById('gbig').src=im.src; g.scrollTop=0; }); document.getElementById('gback').onclick=()=>gallery(); }
    g.scrollTop=0; }
  document.getElementById('all').onclick=()=>{ walking(false); gallery(); };
  window.__stations=S; window.__all=everySound;
  window.addEventListener('resize',size); size(); show(S[0]); update();
})();
</script>
</body>
